appId: com.worm-vue3-print.client
productName: WormPrintClient
copyright: MIT
directories:
  output: dist
  buildResources: build
# 安装包（安装版）与绿色目录版（--dir）共用此配置；
# 绿色目录版通过 electron-builder --dir 只产出 unpacked 目录，不产出安装包。
files:
  - out/**/*
  - package.json
  # 运行时取窗口/托盘图标用（app-icon.ts 按 out/main → ../../build 解析），保证与安装包图形一致
  - build/icon.png
# workspace 依赖（@worm-vue3-print/core、@worm-vue3-print/echarts 及其 echarts 依赖）与 ws
# 由 electron-builder 从各自 dist 收集进 asar；打包脚本会先构建它们。
asar: true
# 产物名固定带平台与架构，便于直接作为发行版附件下载（否则同名文件会互相覆盖）
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
# 应用图标：build/icon.png（1024 圆角 RGBA）由 electron-builder 派生 icns / ico，
# 仓库只存这一份源图，不入库派生产物。
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.utilities
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: WormPrintClient
# Linux 安装包（deb / rpm / AppImage）可在 macOS 上交叉构建，但 rpm 目标要调 rpmbuild，
# 宿主 macOS 没有该可执行文件，因此统一走 Docker 容器构建：npm run pack:client:linux。
# 可执行名必须显式给出：默认从包名 @worm-vue3-print/print-client 派生会带出 "@" 和 "/"，
# AppImage/deb 打包会因非法文件名字符中止。
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
  category: Utility
  executableName: wormprint-client
