<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>/* ── 打印纸张：浏览器原生打印按此尺寸分页（Playwright page.pdf 以显式宽高为准，无副作用） ── */
@page { size: 210mm 297mm; margin: 0; }

/* ── 全局重置 ── */
* { margin: 0; padding: 0; box-sizing: border-box; }

/* 打印必须保留元素背景色（Chromium 默认剔除背景，需显式声明） */
* { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

body { font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif; }

/* ── 屏幕预览：灰底 + 纸张阴影/页间距；打印时去除 ── */
@media screen {
  body { background: #e9ebee; }
  .print-page { margin: 12px auto; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.18); }
}
@media print {
  body { background: #fff; }
  .print-page { margin: 0; box-shadow: none; }
}

/* ── 纸张页面 ── */
.print-page {
  width: 210mm;
  min-height: 297mm;
  background: #fff;
  padding: 10mm 10mm 10mm 10mm;
  position: relative;
  page-break-after: always;
  overflow: hidden;
}
.print-page:last-child {
  page-break-after: auto;
}

/* ── 水印层：覆盖整页、位于所有内容之下（显式矢量瓦片，禁止用 CSS 平铺背景：
       Chromium 会把它编译成 PDF 平铺图案，出纸链路的 RIP 会忽略图案矩阵导致水印放大/错位） ── */
.watermark-layer {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}
/* 单块水印瓦片：位置/尺寸由 core 的瓦片网格给出（mm） */
.watermark-tile {
  position: absolute;
  pointer-events: none;
}

/* ── 页眉 ── */
.page-header {
  width: 190mm;
  height: 0mm;
  position: relative;
}

/* ── 页脚：绝对定位固定在页面底部（内容不足时不随文档流上浮） ──
   用显式 top 定位到「纸高 - 下边距 - 页脚高」，保证下边距生效、
   与设计器 CanvasPaper 的三区几何一致。
   绝对定位的包含块是 padding box 外缘（= 纸面），left 须显式补左边距。 */
.page-footer {
  width: 190mm;
  height: 0mm;
  position: absolute;
  top: 287mm;
  left: 10mm;
}

/* ── 内容区 ── */
.content-area {
  width: 190mm;
  position: relative;
  overflow: visible;
}

/* ── 元素通用定位 ── */
.print-element {
  position: absolute;
  overflow: hidden;
}

/* ── 表格样式 ── */
.print-table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}
.print-table th,
.print-table td {
  border: 1px solid #ccc;
  padding: 2mm 3mm;
  word-break: normal;
  overflow-wrap: break-word;
  overflow: hidden;
}
.print-table thead th {
  background-color: #f5f5f5;
  font-weight: bold;
}

/* ── 测量模式 ── */
.measure-mode .print-page {
  height: auto;
  min-height: auto;
  overflow: visible;
}
.measure-mode .content-area {
  height: auto;
  overflow: visible;
}</style>
