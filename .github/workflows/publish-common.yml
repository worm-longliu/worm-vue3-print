name: Publish common

# 仅手动触发：正式版发 latest，预发布（版本含 -）发 next；推 tag 不会自动发布。
# 触发：Actions → Publish common → Run workflow，或
#   gh workflow run publish-common.yml -f version=1.4.0 -f dry_run=true
# 包虽按正式版本号发布，但 npm 主页面必须保留实验性声明。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的 common 版本号（需与 packages/print-common/package.json 一致，如 1.4.0）'
        required: true
        type: string
      dry_run:
        description: '只打包干跑，不上传'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-common-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: 安装依赖
        run: npm ci

      - name: 构建 core、canvas 与 common
        run: |
          npm run build -w @worm-vue3-print/core
          npm run build -w @worm-vue3-print/canvas
          npm run build -w @worm-vue3-print/common

      - name: 测试 core、canvas 与 common
        run: |
          npm test -w @worm-vue3-print/core
          npm test -w @worm-vue3-print/canvas
          npm test -w @worm-vue3-print/common

      - name: 校验版本号并选择 dist-tag
        run: |
          ACTUAL=$(node -p "require('./packages/print-common/package.json').version")
          if [ "$ACTUAL" != "${{ inputs.version }}" ]; then
            echo "::error::common 版本 $ACTUAL 与输入 ${{ inputs.version }} 不一致"
            exit 1
          fi
          case "$ACTUAL" in
            *-*) DIST_TAG=next ;;
            *) DIST_TAG=latest ;;
          esac
          echo "发布版本 $ACTUAL，dist-tag $DIST_TAG"
          echo "PKG_VERSION=$ACTUAL" >> "$GITHUB_ENV"
          echo "DIST_TAG=$DIST_TAG" >> "$GITHUB_ENV"

      - name: 验证 npm 登录态
        run: npm whoami --registry=https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 发布 @worm-vue3-print/common
        run: |
          EXTRA=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then EXTRA="--dry-run"; fi
          npm publish -w @worm-vue3-print/common --tag "$DIST_TAG" --access public \
            --registry=https://registry.npmjs.org $EXTRA
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 复查 dist-tags
        run: |
          node scripts/check-common-dist-tag.mjs --warn-only
          TAGS=$(npm view @worm-vue3-print/common dist-tags --json --registry=https://registry.npmjs.org)
          echo "$TAGS"
          LATEST=$(printf '%s' "$TAGS" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).latest || ''")
          if [ "$DIST_TAG" = "latest" ]; then
            if [ "$LATEST" != "$PKG_VERSION" ]; then
              echo "::warning::latest=$LATEST 与 $PKG_VERSION 不一致；registry 可能仍在处理，稍后用 npm view 复查"
            fi
          elif [ -n "$LATEST" ]; then
            echo "::warning::latest 仍指向 $LATEST；预发布需要维护者本机 OTP 执行 npm dist-tag rm @worm-vue3-print/common latest --registry=https://registry.npmjs.org --otp=<OTP>"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
