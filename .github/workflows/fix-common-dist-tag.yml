name: Fix common dist-tag

# 维护用：common 首次发布会把 latest 自动打在预览版上，发布后用本工作流摘除 latest。
# 仅手动触发；复用 check-common-dist-tag.mjs 的判据与修复路径。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: 摘除 latest 并复查
        run: |
          node scripts/check-common-dist-tag.mjs --fix
          npm view @worm-vue3-print/common dist-tags --json --registry=https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
