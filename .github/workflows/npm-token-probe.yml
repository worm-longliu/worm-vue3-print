name: NPM Token Probe

# 一次性诊断：用仓库级 NPM_TOKEN 验证 npm 登录态与打包干跑，不执行任何 publish。
# 验证完成后删除本文件。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: 验证 token 登录态
        run: |
          echo "token length=${#NODE_AUTH_TOKEN}"
          npm whoami --registry=https://registry.npmjs.org
          npm ping --registry=https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 安装依赖
        run: npm ci

      - name: 构建 core 与 canvas
        run: |
          npm run build -w @worm-vue3-print/core
          npm run build -w @worm-vue3-print/canvas

      - name: 查看 scope 下可见包（只读）
        run: npm access list packages @worm-vue3-print --json || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: core 打包干跑
        working-directory: packages/print-core
        run: npm publish --dry-run --access public --registry=https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: canvas 打包干跑
        working-directory: packages/print-canvas
        run: npm publish --dry-run --access public --registry=https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
