<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>portrait card · mcp-agent（浏览器 / 客户端 / AI agent 链路）</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* 核心内容带：y 240–1400（画布中央 3:4 区内，下沿留给字幕；右侧留 168px 给抖音按钮列） */
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(1200px 800px at 85% -5%, rgba(167, 139, 250, 0.18), transparent 60%),
      radial-gradient(1000px 700px at 0% 105%, rgba(56, 189, 248, 0.14), transparent 60%),
      #0b1120;
    color: #e2e8f0;
    display: flex; flex-direction: column;
    padding: 240px 168px 520px 72px;
  }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; font-size: 32px; color: #c4b5fd; letter-spacing: 2px; }
  .topbar .l { display: flex; align-items: center; gap: 16px; }
  .topbar .dot { width: 15px; height: 15px; border-radius: 50%; background: #34d399; box-shadow: 0 0 22px #34d399; }
  .topbar .idx { font-size: 28px; color: #64748b; letter-spacing: 4px; }
  .stage { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 34px; }
  .kicker { font-size: 40px; color: #94a3b8; font-weight: 600; }
  .huge { font-size: 92px; font-weight: 800; line-height: 1.16; letter-spacing: 1px; }
  .huge .hl { color: #a78bfa; }
  .huge .ok { color: #34d399; }
  .huge .no { color: #fbbf24; }
  .sub { font-size: 42px; line-height: 1.5; color: #cbd5e1; }
  .sub b { color: #f8fafc; }
  .chiprow { display: flex; flex-wrap: wrap; gap: 20px; }
  .chip { font-size: 32px; font-weight: 700; padding: 14px 26px; border-radius: 999px; background: rgba(52, 211, 153, 0.12); border: 2px solid rgba(52, 211, 153, 0.5); color: #6ee7b7; }
  .chip.pur { background: rgba(167, 139, 250, 0.14); border-color: rgba(167, 139, 250, 0.5); color: #c4b5fd; }
  .chip.no { background: rgba(251, 191, 36, 0.1); border-color: rgba(251, 191, 36, 0.45); color: #fcd34d; }
  .panel { background: rgba(148, 163, 184, 0.08); border: 2px solid rgba(148, 163, 184, 0.22); border-radius: 26px; padding: 28px 32px; }
  .panel .pt { font-size: 31px; color: #94a3b8; font-weight: 700; margin-bottom: 14px; letter-spacing: 2px; }
  .code { font-family: "SF Mono", Menlo, monospace; font-size: 30px; line-height: 1.62; color: #cbd5e1; white-space: pre-wrap; word-break: break-all; }
  .code .k { color: #7dd3fc; }
  .code .v { color: #6ee7b7; }
  .code .c { color: #64748b; }
  .code .e { color: #fbbf24; }
  .grp { border-left: 8px solid rgba(167, 139, 250, 0.7); background: rgba(148, 163, 184, 0.07); border-radius: 0 22px 22px 0; padding: 22px 28px; }
  .grp .gh { font-size: 35px; font-weight: 800; color: #c4b5fd; margin-bottom: 10px; }
  .grp .gt { font-family: "SF Mono", Menlo, monospace; font-size: 29px; color: #7dd3fc; line-height: 1.6; word-break: break-all; }
  .grp .gn { font-size: 30px; color: #94a3b8; line-height: 1.5; margin-top: 8px; }
  .grp .gn b { color: #e2e8f0; }
  .grp.b { border-left-color: rgba(56, 189, 248, 0.75); }
  .grp.b .gh { color: #7dd3fc; }
  .grp.g { border-left-color: rgba(52, 211, 153, 0.75); }
  .grp.g .gh { color: #6ee7b7; }
  .grp.n { border-left-color: rgba(251, 191, 36, 0.75); }
  .grp.n .gh { color: #fbbf24; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .card2 { border-radius: 24px; padding: 26px 24px; background: rgba(148, 163, 184, 0.08); border: 2px solid rgba(148, 163, 184, 0.22); }
  .card2 .h { font-size: 33px; font-weight: 800; margin-bottom: 12px; }
  .card2 .h.a { color: #7dd3fc; }
  .card2 .h.p { color: #c4b5fd; }
  .card2 .h.n { color: #fbbf24; }
  .card2 .l { font-size: 29px; color: #cbd5e1; line-height: 1.7; }
  .note { font-size: 31px; color: #94a3b8; line-height: 1.5; }
  .note b { color: #e2e8f0; }
  .warn { border: 3px solid rgba(251, 191, 36, 0.6); background: rgba(251, 191, 36, 0.08); border-radius: 26px; padding: 26px 30px; }
  .warn .t { font-size: 40px; color: #fbbf24; font-weight: 800; margin-bottom: 12px; }
  .warn .c { font-size: 32px; color: #fde68a; line-height: 1.5; }
  .flow { display: flex; flex-direction: column; gap: 10px; }
  .fbox { border-radius: 20px; border: 2px solid rgba(125, 211, 252, 0.4); background: rgba(56, 189, 248, 0.1); padding: 18px 24px; font-size: 31px; font-weight: 700; color: #e2e8f0; text-align: center; }
  .fbox.mono { font-family: "SF Mono", Menlo, monospace; font-size: 28px; font-weight: 600; color: #7dd3fc; word-break: break-all; }
  .fbox.core { border-color: rgba(167, 139, 250, 0.6); background: rgba(167, 139, 250, 0.14); }
  .fbox.out { border-color: rgba(52, 211, 153, 0.5); background: rgba(52, 211, 153, 0.1); }
  .arr { text-align: center; font-size: 27px; color: #64748b; line-height: 1.15; }
  .steps { display: flex; flex-direction: column; gap: 12px; }
  .step { display: flex; align-items: center; gap: 18px; background: rgba(148, 163, 184, 0.08); border: 2px solid rgba(148, 163, 184, 0.2); border-radius: 18px; padding: 14px 20px; }
  .step .n { width: 48px; height: 48px; border-radius: 50%; flex: none; background: rgba(167, 139, 250, 0.18); border: 2px solid rgba(167, 139, 250, 0.5); color: #c4b5fd; font-size: 27px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .step .t { font-size: 29px; color: #cbd5e1; line-height: 1.35; }
  .step .t i { font-family: "SF Mono", Menlo, monospace; font-style: normal; color: #7dd3fc; font-size: 27px; }
  .step.hi { border-color: rgba(52, 211, 153, 0.45); background: rgba(52, 211, 153, 0.07); }
  .step.hi .n { border-color: rgba(52, 211, 153, 0.6); background: rgba(52, 211, 153, 0.16); color: #6ee7b7; }
  .qrbox { display: flex; align-items: center; gap: 30px; }
  .qrbox img { width: 196px; height: 196px; border-radius: 18px; border: 3px solid rgba(167, 139, 250, 0.45); }
</style>
</head>
<body>
<div class="topbar">
  <span class="l"><span class="dot"></span><span>worm-vue3-print · MCP 链路</span></span>
  <span class="idx" id="idx"></span>
</div>
<div class="stage" id="stage"></div>
<script>
  const q = new URLSearchParams(location.search);
  const body = q.get('body') || 'hook';
  document.getElementById('idx').textContent = q.get('idx') || '';
  const S = {
    hook: `
      <div class="kicker">浏览器 · 桌面客户端 · AI agent</div>
      <div class="huge">AI 改的是<br/><span class="hl">正开着</span>的那张<br/>打印<span class="ok">模板</span></div>
      <div class="sub">这一条不讲生成，讲<b>三方怎么接起来</b>，<br/>以及接上之后怎么不翻车</div>
      <div class="chiprow">
        <span class="chip pur">1 条本地 WebSocket</span>
        <span class="chip">1 个本机 /mcp</span>
        <span class="chip">9 个工具</span>
      </div>`,
    why: `
      <div class="kicker">为什么非要三方</div>
      <div class="grp b"><div class="gh">浏览器页面（设计器）</div><div class="gn">有<b>画布</b>与实时模板<br/>没有本地打印能力，外部进程也伸不进来</div></div>
      <div class="grp"><div class="gh">桌面客户端（Electron 常驻托盘）</div><div class="gn">有<b>打印机</b>、有本机端口，只绑 127.0.0.1</div></div>
      <div class="grp g"><div class="gh">你的 AI 客户端</div><div class="gn">只认一种交互：<b>工具调用</b></div></div>
      <div class="note">三种能力凑不齐 → 中间必须有一层<b>翻译</b></div>`,
    'page-link': `
      <div class="kicker">第一条线 · 浏览器 → 客户端</div>
      <div class="panel">
        <div class="pt">宿主页面只要这四步（demo/src/template-session.ts）</div>
        <div class="code"><span class="k">const</span> client = <span class="e">new</span> PrintClient()
client.setRequestHandler(handler)  <span class="c">// 接 get/apply</span>
client.connect()                   <span class="c">// 探测本机端口</span>
client.onStatusChange(s =&gt;
  s === <span class="v">'connected'</span> &amp;&amp; client.attachTemplate(
    { sessionId, name, url }))</div>
      </div>
      <div class="grp b"><div class="gh">通道口径</div><div class="gn">SDK 子路径 <b>@worm-vue3-print/core/client</b><br/>本地 WebSocket，只绑 <b>127.0.0.1</b>；从 <b>17521</b> 起连续探测 <b>20</b> 个端口</div></div>
      <div class="note">客户端没开？不抛错、不阻塞设计器，SDK 按<b>固定退避</b>自己重连</div>`,
    attach: `
      <div class="kicker">连上只是认识，签到才算会话</div>
      <div class="panel">
        <div class="pt">template.attach 的注册门槛（客户端侧）</div>
        <div class="code">① 必须带 Origin，没来源的页面 <span class="e">UNAUTHORIZED</span>
② sessionId 只收 16–128 位随机串 <span class="c">[A-Za-z0-9_-]</span>
③ 一个连接只绑一个会话，换号要先 detach
④ 全局上限 32 个会话 → 超了回 <span class="e">BUSY</span>
⑤ 跨 Origin 不许顶号；同源重连才替换旧连接</div>
      </div>
      <div class="warn">
        <div class="t">会话只驻内存</div>
        <div class="c">页面一关、客户端一退就失效<br/>不落盘，也没有任何缓存的旧模板</div>
      </div>`,
    'agent-link': `
      <div class="kicker">第二条线 · AI agent → 客户端</div>
      <div class="panel">
        <div class="pt">设置页开「AI 助手」（默认关）后直接给这段</div>
        <div class="code">{ <span class="k">"mcpServers"</span>: { <span class="k">"worm-vue3-print"</span>: {
    <span class="k">"url"</span>: <span class="v">"http://127.0.0.1:17521/mcp"</span>,
    <span class="k">"headers"</span>: { <span class="k">"Authorization"</span>: <span class="v">"Bearer 配对令牌"</span> }
  } } }</div>
      </div>
      <div class="grp g"><div class="gh">这台 MCP server 的接法</div><div class="gn">无状态 Streamable HTTP，<b>每个请求新建再关</b><br/>只收 POST · 请求体上限 4 MiB · 令牌常量时间比较<br/>开关没开时一律 <b>404</b>，不暴露入口存在</div></div>
      <div class="note">贴进去就多出 9 个工具，<b>其中 3 个专门读写画布</b></div>`,
    sequence: `
      <div class="kicker">一轮完整读写长这样</div>
      <div class="steps">
        <div class="step"><span class="n">1</span><span class="t"><i>print_list_open_templates</i> 列出打开的页面</span></div>
        <div class="step"><span class="n">2</span><span class="t"><i>print_get_open_template</i> 取实时快照</span></div>
        <div class="step"><span class="n">3</span><span class="t">拿到 <i>templateJson</i> + <i>revision</i>（内容指纹）</span></div>
        <div class="step"><span class="n">4</span><span class="t">AI 在手里改这份模板</span></div>
        <div class="step"><span class="n">5</span><span class="t"><i>print_apply_open_template</i> 带 <i>baseRevision</i> 写回</span></div>
        <div class="step"><span class="n">6</span><span class="t">客户端先过三道门，再发 <i>template.apply</i> 给浏览器</span></div>
        <div class="step hi"><span class="n">7</span><span class="t">页面写回画布（记一步历史），回<b style="color:#6ee7b7">新 revision</b></span></div>
      </div>
      <div class="note">快照按页面现状<b>实时</b>取，中间没有缓存层</div>`,
    race: `
      <div class="kicker">为什么必须带指纹</div>
      <div class="panel">
        <div class="code"><span class="c"># revision = 画布内容排序后的 SHA-256</span>
get   → <span class="v">revision 3f9a…</span>
<span class="e">用户在画布上又拖了两下</span>
apply(baseRevision: 3f9a…)
      → <span class="e">REVISION_CONFLICT</span> <span class="c">// 不写、不合并、不覆盖</span>
get   → <span class="v">新 revision</span> → apply <span class="v">ok ✓</span></div>
      </div>
      <div class="sub">画布是<b>人也在拖</b>的，<br/>旧指纹一律拒回来，让它重读一次</div>
      <div class="chiprow">
        <span class="chip">一步撤销可恢复</span>
        <span class="chip pur">同页读写排队</span>
        <span class="chip no">读 5s / 写 10s 超时</span>
      </div>`,
    paper: `
      <div class="kicker">这条链得闭到纸上</div>
      <div class="flow">
        <div class="fbox">AI 写回后的画布模板</div>
        <div class="arr">↓ core/browser 两遍渲染（测量 → 分页 → 最终 HTML）</div>
        <div class="fbox mono">print.submitHtml（推荐通路）</div>
        <div class="arr">↓ 同一条本地 WebSocket</div>
        <div class="fbox out">客户端 → 系统命令静默出纸</div>
      </div>
      <div class="note">旧的 <b>print.submit</b>（客户端内渲染）保留兼容；打印机列表 <b>printers.list</b> 也走这条通道</div>
      <div class="warn">
        <div class="t">但 AI 不能替你按打印键</div>
        <div class="c">9 个工具里没有任何一个能连到打印机<br/>AI 只改模板，按不按打印在人这边</div>
      </div>`,
    guard: `
      <div class="kicker">给同行的两条边界</div>
      <div class="grp g"><div class="gh">readOnlyHint · 5 个纯计算工具</div><div class="gn">不落文件、不出网 → 宿主可<b>免审批</b>放行</div></div>
      <div class="grp n"><div class="gh">destructiveHint · apply 写回</div><div class="gn">整份替换画布 → 必须走<b>用户确认</b></div></div>
      <div class="panel">
        <div class="pt">连接器自己的密钥面</div>
        <div class="code">config.ts 只读 2 项环境变量：
<span class="v">PRINT_RENDER_BASE_URL</span> / <span class="v">RENDER_API_KEY</span>
单测扫自己的源码：出现模型密钥字样即判红</div>
      </div>
      <div class="note">桌面形态剔除远程渲染与 <b>templatePath</b>，伪造传入 → isError，不触达磁盘</div>`,
    cta: `
      <div class="kicker">现状与入口</div>
      <div class="warn">
        <div class="t">还没发布到 npm</div>
        <div class="c">@worm-vue3-print/mcp 是仓库内 private 包<br/>客户端（clients/print-client）也是工作区包，安装包挂 Releases</div>
      </div>
      <div class="two">
        <div class="card2"><div class="h a">页面侧接线</div><div class="l">demo/src/<br/>template-session.ts<br/>整份可抄</div></div>
        <div class="card2"><div class="h p">AI 侧接入</div><div class="l">客户端设置页<br/>开「AI 助手」<br/>粘 mcpServers</div></div>
      </div>
      <div class="note">文档：<b>docs/中文/指南/MCP集成.md</b> · <b>静默打印.md</b></div>
      <div class="qrbox">
        <img src="../../douyin.png" alt="douyin" />
        <div class="note">关注更新<br/>仓库 Gitee / GitHub<br/><b style="color:#e2e8f0">要接你的字段，欢迎提 issue</b></div>
      </div>`,
  };
  document.getElementById('stage').innerHTML = S[body] || S.hook;
</script>
</body>
</html>
